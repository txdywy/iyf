<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://api.tvmaze.com; img-src 'self' https: data:; script-src 'self'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>韩剧 & 轻松搞笑综艺推荐 - 新剧新综不错过</title>
  <meta name="description" content="精选韩剧和国内轻松搞笑综艺推荐,奔跑吧、王牌对王牌、现在就出发等新综实时追踪,轻松搞笑不踩雷">
  <meta name="theme-color" content="#0f0f13">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="剧荒救星">
  <meta property="og:title" content="剧荒救星 — 韩剧 & 轻松搞笑综艺推荐">
  <meta property="og:description" content="精选韩剧和国内轻松搞笑综艺推荐,新综实时追踪,轻松搞笑不踩雷">
  <meta property="og:locale" content="zh_CN">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="剧荒救星 — 韩剧 & 轻松搞笑综艺推荐">
  <meta name="twitter:description" content="精选韩剧和国内轻松搞笑综艺推荐,新综实时追踪,轻松搞笑不踩雷">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <a class="skip-link" href="#mainContent">跳到推荐内容</a>
    <!-- 头部 -->
    <header class="header">
      <div class="container">
        <h1 class="logo">🎬 剧荒救星</h1>
        <p class="subtitle">精选韩剧与轻松搞笑综艺，帮你快速找到下一部想看的内容</p>
        <div class="update-info" id="updateInfo" role="status" aria-live="polite">加载中...</div>
      </div>
    </header>

    <!-- 导航标签 -->
    <nav class="tabs" aria-label="内容分类">
      <div class="container" role="tablist">
        <button id="tab-korean" class="tab active" data-tab="korean" role="tab" aria-controls="showGrid" aria-selected="true" tabindex="0">🇰🇷 韩剧推荐</button>
        <button id="tab-year" class="tab" data-tab="year" role="tab" aria-controls="showGrid" aria-selected="false" tabindex="-1">🔥 <span id="yearTabLabel">新剧</span></button>
        <button id="tab-varietyYear" class="tab" data-tab="varietyYear" role="tab" aria-controls="showGrid" aria-selected="false" tabindex="-1">😂 <span id="varietyYearTabLabel">新综艺</span></button>
        <button id="tab-variety" class="tab" data-tab="variety" role="tab" aria-controls="showGrid" aria-selected="false" tabindex="-1">🎬 全部综艺</button>
        <button id="tab-new" class="tab" data-tab="new" role="tab" aria-controls="showGrid" aria-selected="false" tabindex="-1">🆕 最新更新</button>
        <button id="tab-classic" class="tab" data-tab="classic" role="tab" aria-controls="showGrid" aria-selected="false" tabindex="-1">🏆 经典必看</button>
        <button id="tab-tvmaze" class="tab" data-tab="tvmaze" role="tab" aria-controls="showGrid" aria-selected="false" tabindex="-1">📡 韩剧时间表</button>
      </div>
    </nav>

    <!-- 筛选栏 -->
    <section class="filters" aria-labelledby="filterHeading">
      <div class="container">
        <h2 class="sr-only" id="filterHeading">筛选和搜索</h2>
        <div class="filter-row">
          <div class="filter-controls" id="filterControls">
            <div class="filter-group">
              <label for="filterStatus">状态</label>
              <select id="filterStatus">
                <option value="all">全部</option>
                <option value="ongoing">连载中</option>
                <option value="complete">已完结</option>
              </select>
            </div>
            <div class="filter-group">
              <label for="filterScore">评分</label>
              <select id="filterScore">
                <option value="0">不限</option>
                <option value="7">7分以上</option>
                <option value="8">8分以上</option>
                <option value="9">9分以上</option>
              </select>
            </div>
            <div class="filter-group">
              <label for="sortBy">排序</label>
              <select id="sortBy">
                <option value="recommend">推荐优先</option>
                <option value="score">评分最高</option>
                <option value="newest">最新发布</option>
                <option value="popular">最多播放</option>
              </select>
            </div>
          </div>
          <div class="search-box">
            <input type="search" id="searchInput" placeholder="搜索剧名/演员..." aria-label="搜索剧名或演员" autocomplete="off">
          </div>
          <button class="filter-toggle" id="filterToggle" type="button" aria-controls="filterControls" aria-expanded="false">筛选与排序</button>
        </div>
        <div class="filter-meta">
          <span class="result-summary" id="resultSummary" role="status" aria-live="polite"></span>
          <button class="filter-reset" id="resetFilters" type="button" hidden>清除筛选</button>
        </div>
      </div>
    </section>

    <!-- 统计栏 -->
    <section class="stats-bar" aria-labelledby="statsHeading">
      <div class="container">
        <h2 class="sr-only" id="statsHeading">推荐统计</h2>
        <div class="stat-item">
          <span class="stat-num" id="statTotal">0</span>
          <span class="stat-label">推荐总数</span>
        </div>
        <div class="stat-item">
          <span class="stat-num" id="statOngoing">0</span>
          <span class="stat-label">正在连载</span>
        </div>
        <div class="stat-item">
          <span class="stat-num" id="statComplete">0</span>
          <span class="stat-label">已完结</span>
        </div>
        <div class="stat-item">
          <span class="stat-num" id="statHighScore">0</span>
          <span class="stat-label">高分佳作</span>
        </div>
      </div>
    </section>

    <!-- 内容区域 -->
    <main class="content" id="mainContent" tabindex="-1">
      <div class="container">
        <h2 class="sr-only" id="contentHeading">推荐内容</h2>
        <div class="show-grid" id="showGrid" role="tabpanel" aria-label="推荐结果" aria-labelledby="tab-korean" aria-describedby="resultSummary" aria-busy="true">
          <!-- JS 动态渲染 -->
        </div>
        <button class="load-more" id="loadMore" type="button" aria-controls="showGrid" hidden>加载更多</button>
        <div class="loading" id="loading" role="status" aria-live="polite">
          <div class="spinner"></div>
          <p>正在加载推荐数据...</p>
        </div>
        <div class="empty" id="empty" role="status" aria-live="polite" style="display:none">
          <p id="emptyMessage">😢 暂无符合条件的推荐</p>
          <button class="empty-action" id="emptyAction" type="button" hidden></button>
        </div>
      </div>
    </main>

    <!-- 底部 -->
    <footer class="footer">
      <div class="container">
        <p>数据来源: 爱壹帆 · 每日自动更新 · 仅供个人学习使用</p>
        <p class="footer-note">推荐算法基于评分、人气、类型偏好综合计算</p>
      </div>
    </footer>
  </div>

  <script src="js/app.js"></script>
</body>
</html>

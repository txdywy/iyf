name: Scrape & Deploy

on:
  schedule:
    # 每天 2 次: 00:00/12:00 UTC (北京时间 08:00/20:00)
    - cron: '0 0,12 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'

permissions: {}

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  scrape:
    name: 抓取数据 & 构建站点
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # 核心30页 + 17次发现搜索各有15秒上限，再加两段8分钟富化/AI预算。
    # 最坏路径超过25分钟，任务上限需留出构建与提交余量。
    timeout-minutes: 40
    permissions:
      contents: write
    outputs:
      publish: ${{ steps.commit.outputs.publish }}
      sha: ${{ steps.commit.outputs.sha }}
    env:
      # 抓取任务必须拒绝发布超过 7 天的数据；PR 和 Cloudflare 重建只给出警告。
      IYF_REQUIRE_FRESH_DATA: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 抓取器处理不可信的外部响应；写权限令牌只在提交步骤中临时使用。
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
          package-manager-cache: false

      - name: Run regression tests
        run: node --test

      - name: Validate TMDB_TOKEN
        run: |
          if [ -z "$TMDB_TOKEN" ]; then
            echo "::warning::TMDB_TOKEN 未配置! 抓取将无法获取 TMDB 高清封面,新节目只能使用低质量源站图片。"
            echo "请在 Settings → Secrets → Actions 中添加 TMDB_TOKEN (TMDB API v4 Read Access Token)。"
          else
            echo "✓ TMDB_TOKEN 已配置"
          fi
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}

      - name: Run Scraper
        run: node scripts/scrape.mjs
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}

      - name: Validate scraped data
        run: node scripts/validate-data.mjs

      - name: Commit updated data
        id: commit
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          basic="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)"
          echo "::add-mask::$basic"
          git_auth() { git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $basic" "$@"; }
          base_sha="$GITHUB_SHA"

          skip_stale() {
            # 抓取期间 main 已前进：新 push 已在同一并发组排队，会用新代码完整重跑并部署。
            echo "::notice::main advanced from $base_sha to $1 while scraping; skipping this publish in favor of the queued run."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          }

          if ! git diff --quiet data/shows.json data/image_cache.json data/discovery.json data/history.json; then
            # 抓取和校验耗时较长。若期间 main 已前进，不能把旧抓取器生成的数据
            # rebase 到新 schema 上。
            git_auth fetch --no-tags origin main
            remote_sha="$(git rev-parse origin/main)"
            if [ "$remote_sha" != "$base_sha" ]; then
              skip_stale "$remote_sha"
            fi

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/shows.json data/image_cache.json data/discovery.json
            git add -f data/history.json
            git commit -m "chore: update show data $(date -u '+%Y-%m-%d %H:%M')"

            pushed=false
            local_sha="$(git rev-parse HEAD)"
            for i in 1 2 3; do
              if git_auth push origin HEAD:main; then
                pushed=true
                break
              fi

              git_auth fetch --no-tags origin main
              remote_sha="$(git rev-parse origin/main)"
              if [ "$remote_sha" = "$local_sha" ]; then
                # The server accepted the push but the client lost the response.
                pushed=true
                break
              fi
              if [ "$remote_sha" != "$base_sha" ]; then
                skip_stale "$remote_sha"
              fi
              echo "Push attempt $i failed, retrying..."
              sleep 5
            done

            if [ "$pushed" != "true" ]; then
              echo "::error::Failed to push scraped data to main; refusing to deploy an uncommitted Pages artifact."
              exit 1
            fi
          else
            # 数据未变时也要确认 main 仍是本次构建的代码，否则 Cloudflare 会构建更新的 main 并与产物不一致。
            git_auth fetch --no-tags origin main
            remote_sha="$(git rev-parse origin/main)"
            if [ "$remote_sha" != "$base_sha" ]; then
              skip_stale "$remote_sha"
            fi
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build Pages artifact
        if: steps.commit.outputs.publish == 'true'
        run: node scripts/build-site.mjs

      - name: Upload Pages artifact
        if: steps.commit.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: 'site'

  deploy:
    name: 部署 GitHub Pages
    needs: scrape
    if: needs.scrape.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

  deploy-cloudflare:
    name: 部署并验证 Cloudflare Pages
    needs: scrape
    if: needs.scrape.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
          package-manager-cache: false

      - name: Download validated Pages artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: github-pages
          path: pages-artifact

      - name: Extract validated site
        run: |
          mkdir -p site
          tar -xf pages-artifact/artifact.tar -C site

      - name: Confirm main still matches the artifact
        id: head
        env:
          ARTIFACT_SHA: ${{ needs.scrape.outputs.sha }}
        run: |
          # Cloudflare 部署钩子总是构建 main 的最新提交；若 main 已前进，排队中的新运行会负责部署。
          remote_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$remote_sha" != "$ARTIFACT_SHA" ]; then
            echo "::notice::main advanced from $ARTIFACT_SHA to $remote_sha; skipping Cloudflare deploy in favor of the queued run."
            echo "current=false" >> "$GITHUB_OUTPUT"
          else
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger build and verify published files
        if: steps.head.outputs.current == 'true'
        run: node scripts/deploy-cloudflare.mjs
        env:
          CLOUDFLARE_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}

name: Scrape & Deploy

on:
  schedule:
    # 每天 2 次: 00:00/12:00 UTC (北京时间 08:00/20:00)
    - cron: '0 0,12 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'

permissions: {}

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  scrape:
    name: 抓取数据 & 构建站点
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Run regression tests
        run: node --test

      - name: Validate TMDB_TOKEN
        run: |
          if [ -z "$TMDB_TOKEN" ]; then
            echo "::warning::TMDB_TOKEN 未配置! 抓取将无法获取 TMDB 高清封面,新节目只能使用低质量源站图片。"
            echo "请在 Settings → Secrets → Actions 中添加 TMDB_TOKEN (TMDB API v4 Read Access Token)。"
          else
            echo "✓ TMDB_TOKEN 已配置"
          fi
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}

      - name: Run Scraper
        run: node scripts/scrape.mjs
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}

      - name: Validate scraped data
        run: node scripts/validate-data.mjs

      - name: Commit updated data
        run: |
          if ! git diff --quiet data/shows.json data/image_cache.json data/discovery.json; then
            # 抓取和校验耗时较长。若期间 main 已前进，不能把旧抓取器生成的数据
            # rebase 到新 schema 上；新 main push 已会排队触发一次完整工作流。
            git fetch --no-tags origin main
            base_sha="$GITHUB_SHA"
            remote_sha="$(git rev-parse origin/main)"
            if [ "$remote_sha" != "$base_sha" ]; then
              echo "::error::main advanced from $base_sha to $remote_sha while scraping; refusing to publish stale-schema data."
              exit 1
            fi

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/shows.json data/image_cache.json data/discovery.json
            git add -f data/history.json
            git commit -m "chore: update show data $(date -u '+%Y-%m-%d %H:%M')"

            pushed=false
            local_sha="$(git rev-parse HEAD)"
            for i in 1 2 3; do
              if git push origin HEAD:main; then
                pushed=true
                break
              fi

              git fetch --no-tags origin main
              remote_sha="$(git rev-parse origin/main)"
              if [ "$remote_sha" = "$local_sha" ]; then
                # The server accepted the push but the client lost the response.
                pushed=true
                break
              fi
              if [ "$remote_sha" != "$base_sha" ]; then
                echo "::error::main advanced to $remote_sha before the data push; refusing to rebase stale-schema output."
                exit 1
              fi
              echo "Push attempt $i failed, retrying..."
              sleep 5
            done

            if [ "$pushed" != "true" ]; then
              echo "::error::Failed to push scraped data to main; refusing to deploy an uncommitted Pages artifact."
              exit 1
            fi
          fi

      - name: Build Pages artifact
        run: |
          mkdir -p site/data
          cp index.html site/
          cp -R css js site/
          node scripts/build-public-data.mjs --output site/data/shows.json
          cp data/mdl_shows.json site/data/
          cp data/trakt_shows.json site/data/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: 'site'

  deploy:
    name: 部署 GitHub Pages
    needs: scrape
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

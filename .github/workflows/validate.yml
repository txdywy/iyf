name: Validate

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Regression & data validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # 空白检查需要比较任意基准提交；只取提交与树，按需下载文件内容。
          fetch-depth: 0
          filter: blob:none

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
          package-manager-cache: false

      - name: Syntax checks
        run: |
          # 遍历全部脚本，新增脚本无需手动登记。
          for file in js/app.js scripts/*.mjs; do
            node --check "$file"
          done

      - name: Regression tests
        run: node --test --test-reporter=dot

      - name: Validate data and public artifact
        run: |
          node scripts/build-site.mjs --output "$RUNNER_TEMP/iyf-site"

      - name: Reject whitespace errors (pull request)
        if: github.event_name == 'pull_request'
        run: git diff --check "$BASE_SHA...HEAD"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}

      - name: Reject whitespace errors (push)
        if: github.event_name == 'push'
        run: |
          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            git show --check --oneline HEAD
          else
            git diff --check "$BEFORE_SHA..$GITHUB_SHA"
          fi
        env:
          BEFORE_SHA: ${{ github.event.before }}
